<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="608px" preserveAspectRatio="none" style="width:1471px;height:608px;background:#FFFFFF;" version="1.1" viewBox="0 0 1471 608" width="1471px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="284" x="586.8749" y="23.3608">UC-12: Generate Patient Health Summary</text><!--entity Actor1--><g id="elem_Actor1"><ellipse cx="70.5" cy="341.0986" fill="#F1F1F1" rx="8" ry="8" style="stroke:#37474F;stroke-width:0.5;"/><path d="M70.5,349.0986 L70.5,376.0986 M57.5,357.0986 L83.5,357.0986 M70.5,376.0986 L57.5,391.0986 M70.5,376.0986 L83.5,391.0986 " fill="none" style="stroke:#37474F;stroke-width:0.5;"/><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="129" x="6" y="405.0051">Patient / General User</text></g><g id="elem_Generate"><ellipse cx="332.1457" cy="181.2393" fill="#FFF2B3" rx="87.1457" ry="24.1407" style="stroke:#8A6D00;stroke-width:0.5;"/><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="107" x="278.6457" y="176.6971">Generate a patient</text><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="93" x="285.6457" y="191.6458">health summary</text></g><g id="elem_Gather"><ellipse cx="834.3232" cy="271.8633" fill="#FFF2B3" rx="114.3232" ry="25.2646" style="stroke:#8A6D00;stroke-width:0.5;"/><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="144" x="762.3232" y="267.321">Gather permitted records</text><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="153" x="757.8232" y="282.2698">and reported health details</text></g><g id="elem_Review"><ellipse cx="1345.4741" cy="370.2393" fill="#FFF2B3" rx="89.9741" ry="24.1407" style="stroke:#8A6D00;stroke-width:0.5;"/><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="111" x="1289.9741" y="365.6971">Review and confirm</text><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="105" x="1292.9741" y="380.6458">the draft summary</text></g><g id="elem_A1"><ellipse cx="331.8134" cy="276.1613" fill="#FFE4C4" rx="115.8134" ry="25.5627" style="stroke:#8A6D00;stroke-width:0.5;"/><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="140" x="261.8134" y="271.6191">A1: Label missing items</text><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="157" x="253.3134" y="286.5678">and generate a limited draft</text></g><g id="elem_A2"><ellipse cx="834.6488" cy="568.2284" fill="#FFE4C4" rx="128.6488" ry="28.1298" style="stroke:#8A6D00;stroke-width:0.5;"/><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="190" x="739.6488" y="563.6862">A2: Correct supported draft fields</text><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101" x="784.1488" y="578.6349">or source records</text></g><g id="elem_A3"><ellipse cx="834.4532" cy="463.2893" fill="#FFE4C4" rx="113.9532" ry="25.1906" style="stroke:#8A6D00;stroke-width:0.5;"/><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="143" x="762.9532" y="458.747">A3: Do not save or share</text><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="152" x="758.4532" y="473.6958">a new confirmed summary</text></g><g id="elem_Save"><ellipse cx="834.4834" cy="67.9953" fill="#FFF2B3" rx="112.4834" ry="24.8967" style="stroke:#8A6D00;stroke-width:0.5;"/><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="146" x="761.4834" y="63.4531">Save confirmed summary</text><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="148" x="760.4834" y="78.4018">without automatic sharing</text></g><g id="elem_ReviewAgain"><ellipse cx="1345.3749" cy="576.0736" fill="#FFF2B3" rx="120.3749" ry="26.475" style="stroke:#8A6D00;stroke-width:0.5;"/><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="169" x="1260.8749" y="571.5314">Update draft and review again</text><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="44" x="1323.3749" y="586.4801">(step 4)</text></g><g id="elem_Retry"><ellipse cx="331.7929" cy="458.0572" fill="#FFF2B3" rx="82.7929" ry="18.9586" style="stroke:#8A6D00;stroke-width:0.5;"/><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="129" x="267.2929" y="460.9893">Retry saving summary</text></g><!--link Actor1 to Generate--><g id="link_Actor1_Generate"><path d="M109.84,332.4186 C152.65,290.3486 216,228.0986 216,228.0986 C216,228.0986 251.13,213.7386 282.56,200.8986 " fill="none" id="Actor1-Generate" style="stroke:#455A64;stroke-width:1.0;"/></g><!--link Actor1 to Review--><g id="link_Actor1_Review"><path d="M135.06,370.0986 C344.41,370.0986 1012.74,370.0986 1255.39,370.0986 " fill="none" id="Actor1-Review" style="stroke:#455A64;stroke-width:1.0;"/></g><!--link Actor1 to Retry--><g id="link_Actor1_Retry"><path d="M135.31,391.7386 C181.53,407.4086 242.96,428.2386 284.57,442.3586 " fill="none" id="Actor1-Retry" style="stroke:#455A64;stroke-width:1.0;"/></g><!--link Generate to Gather--><g id="link_Generate_Gather"><path d="M404.98,194.1886 C494.78,210.5186 642.3968,237.3553 739.2468,254.9653 " fill="none" id="Generate-to-Gather" style="stroke:#455A64;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#455A64" points="745.15,256.0386,737.0108,250.4931,740.2307,255.1442,735.5796,258.3641,745.15,256.0386" style="stroke:#455A64;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" len