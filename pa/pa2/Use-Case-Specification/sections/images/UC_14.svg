<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="772px" preserveAspectRatio="none" style="width:854px;height:772px;background:#FFFFFF;" version="1.1" viewBox="0 0 854 772" width="854px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="295" x="272.8416" y="23.3608">UC-14: Review Medication Dataset Record</text><!--entity Actor1--><g id="elem_Actor1"><ellipse cx="143.5" cy="361.5986" fill="#F1F1F1" rx="8" ry="8" style="stroke:#37474F;stroke-width:0.5;"/><path d="M143.5,369.5986 L143.5,396.5986 M130.5,377.5986 L156.5,377.5986 M143.5,396.5986 L130.5,411.5986 M143.5,396.5986 L156.5,411.5986 " fill="none" style="stroke:#37474F;stroke-width:0.5;"/><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="100" x="93.5" y="425.5051">Dataset Reviewer</text></g><g id="elem_Select"><ellipse cx="714.696" cy="391.7393" fill="#FFF2B3" rx="82.196" ry="24.1407" style="stroke:#8A6D00;stroke-width:0.5;"/><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="100" x="664.696" y="387.1971">Open a permitted</text><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="83" x="673.196" y="402.1458">dataset record</text></g><g id="elem_Evidence"><ellipse cx="714.5644" cy="267.8115" fill="#FFF2B3" rx="116.5644" ry="25.7129" style="stroke:#8A6D00;stroke-width:0.5;"/><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="159" x="635.0644" y="263.2693">Compare medication record</text><text fill="#202020" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="77" x="676.0644" y="278.218">with evidence</text></g><g id="elem_Decision"><ellipse cx="714.6812" cy="549.7393" fill="#FFF2B3" rx="90.6812" ry="24.1407" style="stroke:#8A6D